<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ · 9 класс · Задание 9 · Линейные уравнения</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Verdana, Arial, sans-serif; background:#F4F7FC; color:#1F2D45; line-height:1.55; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 16px 60px; }
  .hidden { display:none !important; }
  h1 { font-size:1.6rem; color:#15335C; }
  h2 { font-size:1.3rem; color:#15335C; margin-bottom:12px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-size:1.05rem; font-weight:700;
         padding:14px 28px; border-radius:40px; color:#fff; background:#1F7AE0; box-shadow:0 4px 12px rgba(31,122,224,.35);
         transition:transform .12s, box-shadow .12s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(31,122,224,.45); }
  .btn.pink { background:#E2337E; box-shadow:0 4px 12px rgba(226,51,126,.35); }
  .btn.back { background:#5A6B85; font-size:.95rem; padding:10px 20px; margin-bottom:16px; }
  .card { background:#fff; border-radius:18px; padding:22px; box-shadow:0 6px 20px rgba(21,51,92,.08); margin-bottom:18px; }

  /* титульник */
  .cover img { width:100%; max-width:520px; display:block; margin:0 auto 8px; }
  .cover-wide img { width:100%; border-radius:16px; }
  .tagline { text-align:center; color:#5A6B85; margin:6px 0 20px; }
  .levels { display:flex; flex-direction:column; gap:14px; }
  .lv { display:flex; align-items:center; gap:16px; padding:18px; border-radius:16px; color:#fff; cursor:pointer;
        border:none; text-align:left; width:100%; font-size:1.05rem; font-weight:700;
        box-shadow:0 5px 14px rgba(21,51,92,.18); transition:transform .12s; }
  .lv:hover { transform:translateY(-2px); }
  .lv .emo { font-size:2rem; }
  .lv small { display:block; font-weight:400; opacity:.92; margin-top:3px; }
  .lv-base { background:linear-gradient(135deg,#2E9E4F,#23793C); }
  .lv-mid { background:linear-gradient(135deg,#F5C518,#D89E06); color:#4A3600; }
  .lv-hard { background:linear-gradient(135deg,#E85D2F,#C43F14); }
  .video-btn { margin-top:18px; width:100%; }

  /* экран задания */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .cnt { font-weight:700; color:#15335C; white-space:nowrap; }
  .bar { height:10px; background:#E2E9F3; border-radius:6px; overflow:hidden; margin-bottom:18px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#1F7AE0,#E2337E); border-radius:6px; transition:width .3s; }
  .eq { font-size:1.55rem; font-weight:700; color:#15335C; text-align:center; padding:14px 6px;
        background:#F4F8FF; border:2px solid #D6E4F7; border-radius:14px; margin-bottom:16px; font-family:'Cambria Math',Georgia,serif; }
  .ansrow { display:flex; gap:10px; margin-bottom:10px; }
  .ansrow input { flex:1; font-size:1.25rem; padding:12px 14px; border:2px solid #D6E4F7; border-radius:12px; text-align:center; color:#15335C; }
  .ansrow input:focus { outline:none; border-color:#1F7AE0; }
  .rowbtns { display:flex; gap:10px; flex-wrap:wrap; }
  .rowbtns .btn { flex:1; }
  .feedback { margin-top:14px; padding:14px; border-radius:12px; font-weight:600; }
  .ok { background:#E4F7EA; color:#1E7A38; border:1px solid #9CD9AE; }
  .err { background:#FDEAEA; color:#B03030; border:1px solid #EFA9A9; }
  .hintbtn { background:#fff; color:#15335C; border:2px solid #D6E4F7; box-shadow:none; padding:11px 20px; }
  .hintbox { margin-top:14px; background:#FFF9E8; border:1px solid #F0DD9E; border-radius:12px; padding:14px; }
  .hintbox p { margin-bottom:8px; }
  .hintbox img { max-width:180px; display:block; margin:4px auto 10px; }
  .medal-ok { max-width:190px; display:block; margin:10px auto 0; }
  .solution { margin-top:16px; background:#EFF6FF; border:1px solid #C9DCF6; border-radius:12px; padding:14px; }
  .solution p { margin-bottom:6px; }
  .solution b { color:#15335C; }

  /* финал */
  .final { text-align:center; }
  .final img { max-width:300px; width:100%; margin:6px 0 10px; }
  .score { font-size:1.25rem; margin-bottom:8px; }
  .reco { color:#5A6B85; margin-bottom:18px; }

  @media (max-width:520px){
    h1{font-size:1.35rem} .eq{font-size:1.25rem}
    .ansrow{flex-direction:column} .rowbtns{flex-direction:column}
    .lv{padding:15px}
  }
</style>
</head>

/* ---------- состояние ---------- */
let lvl=0, order=[], idx=0, solved=0, wrongTotal=0, mistake={};

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startLevel(n){
  lvl=n; order=shuffle([...Array(LEVELS[n].tasks.length).keys()]); idx=0; solved=0; wrongTotal=0; mistake={};
  document.getElementById('home').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('lvlName').textContent=LEVELS[n].name;
  show();
}
function show(){
  const t=LEVELS[lvl].tasks[order[idx]];
  document.getElementById('cnt').textContent='Задача '+(idx+1)+' из '+order.length;
  document.getElementById('barFill').style.width=Math.round(idx/order.length*100)+'%';
  document.getElementById('eq').textContent=t.eq;
  document.getElementById('ans').value='';
  document.getElementById('ans').focus();
  document.getElementById('fb').innerHTML='';
  document.getElementById('hintbox').innerHTML='';
  document.getElementById('solbox').innerHTML='';
}
function parseAns(s){
  s=(s||'').trim().replace(',','.').replace('−','-');
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function near(a,b){ return Math.abs(a-b)<1e-6; }
function check(){
  const t=LEVELS[lvl].tasks[order[idx]];
  const v=parseAns(document.getElementById('ans').value);
  const fb=document.getElementById('fb');
  if(v===null){ fb.innerHTML='<div class="feedback err">Введите число: целое или дробь через запятую (например 2,5).</div>'; return; }
  if(near(v,parseFloat(t.a))){
    if(!mistake[idx]) solved++;
    fb.innerHTML='<div class="feedback ok">Верно! 👍<img class="medal-ok" src="'+IMG_MEDAL+'" alt="Верно"></div><div class="solution"><b>Разбор решения:</b>'+t.sol.map(s=>'<p>'+s+'</p>').join('')+'</div>';
  } else {
    mistake[idx]=true; wrongTotal++;
    fb.innerHTML='<div class="feedback err">Не совпало. Откройте подсказку — она проведёт по шагам. Ответ можно вводить снова.</div>';
  }
}
function toggleHint(){
  const hb=document.getElementById('hintbox');
  if(hb.innerHTML){ hb.innerHTML=''; return; }
  const t=LEVELS[lvl].tasks[order[idx]];
  hb.innerHTML='<div class="hintbox"><img src="'+IMG_BULB+'" alt="Подсказка">'+t.hints.map(h=>'<p>• '+h+'</p>').join('')+'</div>';
}
function nextTask(){
  idx++;
  if(idx>=order.length){ finish(); } else { show(); }
}
function finish(){
  document.getElementById('quiz').classList.add('hidden');
  const pct=Math.round(solved/order.length*100);
  document.getElementById('end').classList.remove('hidden');
  let title='Проверьте себя', reco='';
  if(pct>=90){ title='Отлично! 🏆'; reco='Задание 9 у вас на отлично — переходите к следующему уровню или повторите перед контрольной.'; }
  else if(pct>=60){ title='Хороший результат!'; reco='Основа есть. Прогоните уровень ещё раз и открывайте разбор к тем задачам, где ошиблись.'; }
  else { reco='Начните с разборов решений к каждой задаче, а потом пройдите уровень заново с подсказками.'; }
  document.getElementById('endTitle').textContent=title;
  document.getElementById('score').textContent='Решено верно: '+solved+' из '+order.length+' ('+pct+'%)';
  document.getElementById('reco').textContent=reco;
}
function restart(){ startLevel(lvl); }
function goHome(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
function openVideo(){
  if(VIDEO_URL && VIDEO_URL.length>5){ window.open(VIDEO_URL,'_blank'); }
  else { alert('Ссылка на видео-разбор будет добавлена в ближайшее время.'); }
}
document.getElementById('ans').addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
</script>
